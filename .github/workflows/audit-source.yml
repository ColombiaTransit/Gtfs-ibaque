name: Audit pinned upstream GTFS

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_source.py"
      - "scripts/compare_official_hours.py"
      - "sources/upstream.json"
      - "research/official_service_hours.csv"
      - ".github/workflows/audit-source.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit original GTFS
        run: python scripts/audit_source.py --download --output build/audit.json
      - name: Compare with official TransMusical route hours
        run: python scripts/compare_official_hours.py --download --output build/official_hours_comparison.json
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-ibague-source-audit
          path: build/*.json
          if-no-files-found: error
