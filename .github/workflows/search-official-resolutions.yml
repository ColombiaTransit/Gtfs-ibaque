name: Search official Ibagué resolutions

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/search_official_resolutions.py"
      - ".github/workflows/search-official-resolutions.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search official published Gaceta index
        run: python scripts/search_official_resolutions.py
      - name: Archive search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibague-official-resolution-search
          path: build/municipal_resolution_search.json
          if-no-files-found: warn
