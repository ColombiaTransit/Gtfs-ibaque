name: Discover Ibagué official resolution index

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/discover_official_resolutions.py"
      - ".github/workflows/discover-official-resolutions.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official published index and script references
        run: python scripts/discover_official_resolutions.py
      - name: Archive index discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibague-official-index-discovery
          path: build/municipal_index_discovery.json
          if-no-files-found: warn
