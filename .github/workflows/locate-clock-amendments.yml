name: Locate official Ibagué clock amendments

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/locate_clock_amendments.py"
      - ".github/workflows/locate-clock-amendments.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search alternate official document indices
        run: python -u scripts/locate_clock_amendments.py
      - name: Archive link and context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-clock-amendment-discovery
          path: build/clock_amendments_archive_discovery.json
          if-no-files-found: warn
