name: Build Ibagué research GTFS preview

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_gtfs.py
      - scripts/fare_v2.py
      - tests/test_build_gtfs.py
      - tests/test_fare_v2.py
      - research/official_resolution_005549_frequencies.csv
      - research/official_fares_2026.csv
      - research/fare_route_scope_2026.csv
      - .github/workflows/build-preview.yml

permissions:
  contents: read

jobs:
  research-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Colombia holiday calendar dependency
        run: python -m pip install 'holidays>=0.50,<1.0'
      - name: Offline deterministic generator tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build from SHA-256 pinned university GTFS
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_official_frequencies.py --output build/legal_frequency_audit.json
          python scripts/build_gtfs.py \
            --download \
            --start-date 20261120 \
            --days 90 \
            --output build/ibague-research-preview.zip \
            --report build/ibague_generator_report.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run MobilityData validator v8.0.1 on preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar' \
            -o /tmp/gtfs-validator-cli.jar
          echo '19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  /tmp/gtfs-validator-cli.jar' | sha256sum -c -
          mkdir -p build/validator
          java -Xmx2g -jar /tmp/gtfs-validator-cli.jar \
            -i build/ibague-research-preview.zip -o build/validator
      - name: Verify Colombian holiday exceptions in generated feed
        shell: bash
        run: |
          python - <<'PYHOLIDAYS'
          import csv, io, json, zipfile
          from pathlib import Path
          report = json.loads(Path('build/ibague_generator_report.json').read_text(encoding='utf-8'))
          assert report['holiday_effective_service_verified']
          with zipfile.ZipFile('build/ibague-research-preview.zip') as archive:
              exceptions = list(csv.DictReader(io.TextIOWrapper(archive.open('calendar_dates.txt'), encoding='utf-8')))
          for date in ('20261208', '20261225', '20270101', '20270111'):
              assert {'service_id': 'CT_WK', 'date': date, 'exception_type': '2'} in exceptions, date
              assert {'service_id': 'CT_SU', 'date': date, 'exception_type': '1'} in exceptions, date
          assert len(exceptions) == 2 * report['holiday_override_dates']
          print('Colombia holiday overrides checked:', report['holiday_override_dates'])
          print('Holiday names and dates:', report['holiday_details'])
          PYHOLIDAYS
      - name: Verify bounded Fares v2 and holiday prices
        shell: bash
        run: |
          python - <<'PYFARES'
          import csv, io, json, zipfile
          from pathlib import Path
          def rows(z, name):
              return list(csv.DictReader(io.TextIOWrapper(z.open(name), encoding='utf-8')))
          report = json.loads(Path('build/ibague_generator_report.json').read_text(encoding='utf-8'))
          fares = report['fares_v2']
          assert fares['fare_v2_active'] and fares['fare_effective_calendar_verified']
          assert fares['fare_validity_end'] == '2026-12-31'
          assert fares['urban_fare_mapped_routes'] == 25
          with zipfile.ZipFile('build/ibague-research-preview.zip') as z:
              products = rows(z, 'fare_products.txt')
              assert {x['amount'] for x in products} == {'3300', '3400'}
              assert all(x['currency'] == 'COP' for x in products)
              frames = rows(z, 'timeframes.txt')
              assert len(frames) == 3
              rules = rows(z, 'fare_leg_rules.txt')
              assert len(rules) == 2
              scope = rows(z, 'route_networks.txt')
              assert len(scope) == 30
              calendar = rows(z, 'calendar.txt')
              fare_services = {x['service_id'] for x in calendar if x['service_id'].startswith('IBG_FARE_2026_')}
              assert len(fare_services) == 3
              assert all(x['end_date'] == '20261231' for x in calendar if x['service_id'] in fare_services)
              exceptions = rows(z, 'calendar_dates.txt')
              for date in ('20261208', '20261225'):
                  assert {'service_id':'IBG_FARE_2026_WK','date':date,'exception_type':'2'} in exceptions
                  assert {'service_id':'IBG_FARE_2026_SU','date':date,'exception_type':'1'} in exceptions
              assert not any(x['service_id'].startswith('IBG_FARE_2026_') and x['date'] >= '20270101' for x in exceptions)
          print('Confirmed Fares v2, urban route scope, 2026 holiday exceptions, and 2027 expiry')
          PYFARES
      - name: Enforce no MobilityData validation errors
        shell: bash
        run: |
          python - <<'PYVALIDATOR'
          import json
          from pathlib import Path
          p = Path('build/validator/report.json')
          report = json.loads(p.read_text(encoding='utf-8'))
          counts = {s: sum(n.get('totalNotices', 0) for n in report.get('notices', []) if n.get('severity') == s)
                    for s in ('ERROR', 'WARNING', 'INFO')}
          print('MobilityData notice counts:', counts)
          if counts['ERROR']:
              raise SystemExit('GTFS validator reported ERROR notices')
          PYVALIDATOR
      - name: Publish QA reports only (NOT the unlicensed source-derived GTFS ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibague-research-preview-qa
          path: |
            build/legal_frequency_audit.json
            build/ibague_generator_report.json
            build/validator/**
          if-no-files-found: warn
          retention-days: 14
