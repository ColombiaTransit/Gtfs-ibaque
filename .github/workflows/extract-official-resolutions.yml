name: Extract official Ibagué 2026 resolutions

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/extract_official_resolutions.py"
      - ".github/workflows/extract-official-resolutions.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyMuPDF and Spanish OCR for scanned-only PDFs
        run: |
          python -m pip install pymupdf==1.26.5
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Extract official PDF text (OCR only if required)
        run: python -u scripts/extract_official_resolutions.py
      - name: Upload original PDF sources and OCR extracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibague-official-resolutions-2026
          path: build/official_resolutions/
          if-no-files-found: warn
